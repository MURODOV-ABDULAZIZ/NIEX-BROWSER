<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>NIEX Extras — Bridge Test</title>
<style>
  body { background:#0A0E1A; color:#E8F0FE; font-family: monospace; padding: 24px; }
  h1 { color: #00E5A0; }
  h2 { color: #3B82F6; margin-top: 30px; }
  .ok { color: #00E5A0; }
  .err { color: #FF4757; }
  .row { background: rgba(255,255,255,0.04); padding: 12px 16px; border-radius: 8px; margin: 8px 0; border: 1px solid rgba(255,255,255,0.08); }
  pre { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; max-height: 200px; }
</style>
</head>
<body>

<h1>🧪 NIEX Extras Bridge Test</h1>
<p style="color:#94A3B8">Bu sahifa yangi qo'shilgan IPC bridge'larni tekshiradi: quicklinks, focus extras, feedback replies.</p>

<div id="out"></div>

<script>
const out = document.getElementById('out');
function addSection(title) {
  const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
}
function addRow(label, ok, body) {
  const d = document.createElement('div'); d.className = 'row';
  d.innerHTML = `<b>${label}:</b> <span class="${ok ? 'ok' : 'err'}">${ok ? '✅ OK' : '❌ FAIL'}</span>` +
    (body ? `<pre>${body.replace(/</g,'&lt;')}</pre>` : '');
  out.appendChild(d);
}

async function safe(name, fn) {
  try {
    const r = await fn();
    return { ok: true, val: r };
  } catch (e) {
    return { ok: false, err: String(e && e.message || e) };
  }
}

(async () => {
  addSection('1. Bridge Availability');
  addRow('safenet_quicklinks', !!window.safenet_quicklinks, '');
  addRow('safenet_focus_extras', !!window.safenet_focus_extras, '');
  addRow('safenet_feedback_replies', !!window.safenet_feedback_replies, '');
  addRow('safenet_notifications', !!window.safenet_notifications, '');
  addRow('_ipc.invoke', !!(window._ipc && window._ipc.invoke), '');

  addSection('2. Quicklinks IPC (round-trip)');
  const sample = [
    { id: 'test_1', name: 'YouTube', url: 'https://youtube.com', emoji: '📺', color: '#FF4757' },
    { id: 'test_2', name: 'GitHub', url: 'https://github.com', emoji: '💻', color: '#8B5CF6' },
  ];
  if (window.safenet_quicklinks) {
    const r1 = await safe('set', () => window.safenet_quicklinks.set(sample));
    addRow('quicklinks-set', r1.ok, JSON.stringify(r1.val, null, 2));
    const r2 = await safe('list', () => window.safenet_quicklinks.list());
    const matchOk = r2.ok && r2.val && r2.val.length === 2 && r2.val[0].name === 'YouTube';
    addRow('quicklinks-list (verify)', matchOk, JSON.stringify(r2.val, null, 2));
  } else {
    addRow('quicklinks (skipped — bridge missing)', false, '');
  }

  addSection('3. Focus Extras (keywords/whitelist/schedules)');
  if (window.safenet_focus_extras) {
    const kws = ['gossip', 'spam', 'news'];
    const wl = ['github.com'];
    const sch = [{ id: 's1', time: '09:00', durationMinutes: 45, label: 'Ish', days: [1,2,3,4,5], enabled: true }];

    const r1 = await safe('setKeywords', () => window.safenet_focus_extras.setKeywords(kws));
    addRow('focus-keywords-set', r1.ok, '');
    const r2 = await safe('getKeywords', () => window.safenet_focus_extras.getKeywords());
    const kwOk = r2.ok && r2.val && r2.val.length === 3 && r2.val[0] === 'gossip';
    addRow('focus-keywords-get', kwOk, JSON.stringify(r2.val, null, 2));

    const r3 = await safe('setWhitelist', () => window.safenet_focus_extras.setWhitelist(wl));
    addRow('focus-whitelist-set', r3.ok, '');
    const r4 = await safe('getWhitelist', () => window.safenet_focus_extras.getWhitelist());
    const wlOk = r4.ok && r4.val && r4.val.length === 1 && r4.val[0] === 'github.com';
    addRow('focus-whitelist-get', wlOk, JSON.stringify(r4.val, null, 2));

    const r5 = await safe('setSchedules', () => window.safenet_focus_extras.setSchedules(sch));
    addRow('focus-schedules-set', r5.ok, '');
    const r6 = await safe('getSchedules', () => window.safenet_focus_extras.getSchedules());
    const schOk = r6.ok && r6.val && r6.val.length === 1 && r6.val[0].time === '09:00';
    addRow('focus-schedules-get', schOk, JSON.stringify(r6.val, null, 2));
  } else {
    addRow('focus extras (skipped)', false, '');
  }

  addSection('4. Feedback Replies (HTTP / local IPC fallback)');
  const sampleReply = {
    feedbackId: 'fb_test_' + Date.now(),
    from: 'admin',
    message: 'Test javobi: rahmat fikr uchun!',
  };
  if (window.safenet_feedback_replies) {
    const r1 = await safe('add', () => window.safenet_feedback_replies.add(sampleReply));
    addRow('feedback-reply-add', r1.ok, JSON.stringify(r1.val, null, 2));
    const r2 = await safe('list', () => window.safenet_feedback_replies.list());
    const exists = r2.ok && r2.val && r2.val.find(x => x.feedbackId === sampleReply.feedbackId);
    addRow('feedback-reply-list (verify)', !!exists, JSON.stringify(r2.val, null, 2));
  } else {
    addRow('feedback replies (skipped)', false, '');
  }

  addSection('5. HTTP fallback (server-side)');
  try {
    const r = await fetch('http://localhost:13337/api/quicklinks');
    if (r.ok) {
      const data = await r.json();
      addRow('HTTP /api/quicklinks', data.ok, JSON.stringify(data, null, 2));
    } else {
      addRow('HTTP /api/quicklinks (server not running)', false, 'HTTP ' + r.status);
    }
  } catch (e) {
    addRow('HTTP /api/quicklinks (server unavailable)', false, e.message);
  }

  try {
    const r = await fetch('http://localhost:13337/api/feedback-replies');
    if (r.ok) {
      const data = await r.json();
      addRow('HTTP /api/feedback-replies', data.ok, JSON.stringify(data, null, 2));
    } else {
      addRow('HTTP /api/feedback-replies (server not running)', false, 'HTTP ' + r.status);
    }
  } catch (e) {
    addRow('HTTP /api/feedback-replies (server unavailable)', false, e.message);
  }

  addSection('Done');
  document.body.insertAdjacentHTML('beforeend', '<p style="margin-top:30px;color:#94A3B8">✅ Tests completed. Reload page to re-run.</p>');
})();
</script>
</body>
</html>
