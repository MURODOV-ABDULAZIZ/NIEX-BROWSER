<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Information - NIEX</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #0A0E1A;
      color: #E8F0FE;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #111827;
      border: 1px solid #1E2D45;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      background: #1A2235;
      border: none;
      border-radius: 7px;
      color: #8892B0;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
    }

    .close-btn:hover {
      background: #243044;
      color: #E8F0FE;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #8892B0;
    }

    input,
    select {
      width: 100%;
      padding: 10px 14px;
      background: #1A2235;
      border: 1px solid #1E2D45;
      border-radius: 10px;
      color: #E8F0FE;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    input::placeholder,
    select::placeholder {
      color: #4a5568;
    }

    input:focus,
    select:focus {
      border-color: #00E5A0;
      box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.1);
      background: #1E2A3D;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .date-label {
      font-size: 11px;
      color: #6B7A99;
      margin-bottom: 6px;
      display: block;
    }

    .required-note {
      color: #6B7A99;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .error-message {
      color: #FF6B6B;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      padding: 10px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 6px;
      border-left: 3px solid #FF6B6B;
    }

    .error-message.show {
      display: block;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-back {
      background: #1A2235;
      color: #8892B0;
      border: 1px solid #1E2D45;
    }

    .btn-back:hover {
      background: #243044;
      color: #E8F0FE;
    }

    .btn-continue {
      background: linear-gradient(135deg, #00E5A0, #00C885);
      color: #000;
      font-weight: 700;
    }

    .btn-continue:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0, 229, 160, 0.3);
    }

    .btn-continue:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">👤 Personal Information</div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>

    <form id="personalInfoForm">
      <div class="form-group">
        <label for="role">Role *</label>
        <select id="role" required>
          <option value="">-- Select Role --</option>
          <option value="student">Student</option>
          <option value="parent">Parent</option>
          <option value="child">Child</option>
          <option value="user">User</option>
        </select>
      </div>

      <div class="form-group">
        <label for="firstName">First Name *</label>
        <input type="text" id="firstName" placeholder="Your first name" required />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name *</label>
        <input type="text" id="lastName" placeholder="Your last name" required />
      </div>

      <div class="form-group">
        <label for="age">Age *</label>
        <input type="number" id="age" placeholder="Enter your age" min="1" max="120" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" placeholder="+998 90 123 45 67" required />
      </div>

      <p class="required-note">* Required fields</p>

      <div id="errorMessage" class="error-message"></div>

      <div class="button-group">
        <button type="button" class="btn-back" id="backBtn">Back</button>
        <button type="submit" class="btn-continue">Continue</button>
      </div>
    </form>
  </div>

  <script src="profile-service.js"></script>
  <script src="personal-info.js"></script>
</body>
</html>
