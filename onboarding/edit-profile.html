<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - NIEX</title>
  <style>
    body {
      background: #0A0E1A;
      color: #E8F0FE;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1E2D45;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      background: #1A2235;
      border: none;
      border-radius: 8px;
      color: #8892B0;
      cursor: pointer;
      font-size: 18px;
      font-family: inherit;
    }

    .close-btn:hover {
      background: #243044;
      color: #E8F0FE;
    }

    .content {
      flex: 1;
      overflow-y: auto;
    }

    .section {
      background: #111827;
      border: 1px solid #1E2D45;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #00E5A0;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #8892B0;
    }

    input,
    select {
      width: 100%;
      padding: 10px 14px;
      background: #1A2235;
      border: 1px solid #1E2D45;
      border-radius: 8px;
      color: #E8F0FE;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    input::placeholder,
    select::placeholder {
      color: #4a5568;
    }

    input:focus,
    select:focus {
      border-color: #00E5A0;
      box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.1);
      background: #1E2A3D;
    }

    .interests-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .interest-chip {
      padding: 6px 12px;
      background: #00E5A0;
      color: #000;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .button-group {
      display: flex;
      gap: 10px;
      padding: 20px 30px;
      background: #111827;
      border: 1px solid #1E2D45;
      border-radius: 12px;
      margin-bottom: 20px;
      position: sticky;
      bottom: 0;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #1A2235;
      color: #8892B0;
      border: 1px solid #1E2D45;
    }

    .btn-cancel:hover {
      background: #243044;
      color: #E8F0FE;
    }

    .btn-save {
      background: linear-gradient(135deg, #00E5A0, #00C885);
      color: #000;
      font-weight: 700;
    }

    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0, 229, 160, 0.3);
    }

    .btn-save:active {
      transform: translateY(0);
    }

    .edit-button {
      padding: 8px 14px;
      background: #1A2235;
      color: #00E5A0;
      border: 1px solid #1E2D45;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 10px;
    }

    .edit-button:hover {
      background: #243044;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">✏️ Edit Profile</div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>

  <div class="content">
    <div class="section">
      <div class="section-title">👤 Personal Information</div>
      <form id="personalForm">
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" required>
            <option value="student">Student</option>
            <option value="parent">Parent</option>
            <option value="child">Child</option>
            <option value="user">User</option>
          </select>
        </div>

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" placeholder="First name" required />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" placeholder="Last name" required />
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Age" min="1" max="120" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+998 90 123 45 67" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Email" disabled style="background: #0A0E1A;" />
        </div>

        <div class="form-group">
          <label for="uid">UID</label>
          <input type="text" id="uid" placeholder="UID" disabled style="background: #0A0E1A;" />
        </div>
      </form>
    </div>

    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="section-title" style="margin: 0;">🎯 Interests</div>
        <button class="edit-button" id="editInterestsBtn">Edit</button>
      </div>
      <div class="interests-preview" id="interestsPreview"></div>
    </div>
  </div>

  <div class="button-group">
    <button class="btn-cancel" id="cancelBtn">Cancel</button>
    <button class="btn-save" id="saveBtn">Save Changes</button>
  </div>

  <script src="profile-service.js"></script>
  <script src="edit-profile.js"></script>
</body>
</html>
