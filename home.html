<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Niex</title>
<style>
  html, body { margin: 0; height: 100%; background: #030507;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui; color: #4a8b7a; font-size: 12px; letter-spacing: 4px; }
</style>

<body>
◆ NIEX ◆
<script>
/* Tema router — tanlangan temaga darhol yo'naltiradi.
   Default: 'classic' (yengil, mobile-friendly).
   Foydalanuvchi tema tanlaganда localStorage.niex_home_theme saqlanadi. */
(function () {
  // Yangi versiyada 'extension' tanlangan bo'lsa — yangi to'liq sahifaga yo'naltiradi.
  // Eski versiya bilan mos: 'classic' → safenethome.html, 'garage' → garage.html.
  var t = 'classic';
  try {
    t = localStorage.getItem('niex_home_theme') || 'classic';
  } catch (e) {}
  var target;
  if (t === 'extension') target = 'home-extension.html';
  else if (t === 'garage') target = 'garage.html';
  else target = 'safenethome.html';
  location.replace(target);
})();
</script>
</body>
</html>
