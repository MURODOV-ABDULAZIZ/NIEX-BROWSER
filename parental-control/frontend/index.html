<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parental Control Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Parental Control — Onboarding</h1>
    </header>
    <main>
      <section class="card">
        <h2>Connect Your Child</h2>
        <input id="parentEmail" placeholder="Your email" />
        <input id="childEmail" placeholder="Child email" />
        <button id="addChild">Add Child</button>
        <div id="childrenList"></div>
      </section>

      <section class="card">
        <h2>Verification</h2>
        <input id="verifyParentId" placeholder="Parent ID (from creation)" />
        <input id="verifyEmail" placeholder="Child email" />
        <input id="verifyCode" placeholder="6-digit code" />
        <label><input type="checkbox" id="verifyAccept" checked/> Child accepts</label>
        <button id="verifyBtn">Verify Code</button>
        <div id="verifyResult"></div>
      </section>

      <section class="card">
        <h2>Dashboard (demo)</h2>
        <input id="dashboardParentId" placeholder="Parent ID" />
        <button id="loadDashboard">Load Dashboard</button>
        <div id="dashboard"></div>
      </section>
    </main>
    <footer>Demo — all data stored locally in server's JSON DB.</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
