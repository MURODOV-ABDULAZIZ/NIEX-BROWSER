<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Niex — Fikr-mulohaza</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0A0E1A;color:#E8F0FE;font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh}
body{background:radial-gradient(circle at 20% 10%, rgba(0,229,160,.14), transparent 12%),radial-gradient(circle at 85% 20%, rgba(59,130,246,.14), transparent 15%),linear-gradient(180deg, #0A0E1A 0%, #08101C 100%);padding:0 0 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(10,14,26,.6);backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:14px}
.brand-icon{width:44px;height:44px;background:linear-gradient(135deg,#00E5A0,#3B82F6);border-radius:14px;display:grid;place-items:center;font-size:22px}
.brand-title{font-size:20px;font-weight:800}
.brand-sub{font-size:12px;color:#94A3B8}
.topbar-actions{display:flex;gap:10px}
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#E8F0FE;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#00E5A0,#00C589);border-color:transparent;color:#03130F;font-weight:800;box-shadow:0 10px 30px rgba(0,229,160,.35)}
.container{max-width:760px;margin:30px auto;padding:0 28px}
.hero{text-align:center;margin-bottom:26px}
.hero h1{font-size:30px;font-weight:800;margin-bottom:10px;background:linear-gradient(135deg,#00E5A0,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#94A3B8;font-size:14px}
.card{background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;backdrop-filter:blur(20px);margin-bottom:18px}
.form-row{margin-bottom:14px}
.form-label{font-size:13px;color:#94A3B8;margin-bottom:6px;display:block}
.form-input,.form-textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#E8F0FE;padding:11px 14px;border-radius:10px;font-size:14px;outline:none;font-family:inherit}
.form-input:focus,.form-textarea:focus{border-color:#00E5A0;background:rgba(255,255,255,.1)}
.form-textarea{min-height:120px;resize:vertical}
.upload-row{display:flex;gap:8px;align-items:center}
.upload-btn{padding:10px 14px;background:rgba(0,229,160,.1);border:1px dashed rgba(0,229,160,.4);color:#00E5A0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.preview{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.05);border-radius:10px;margin-top:10px}
.preview img{width:50px;height:50px;border-radius:8px;object-fit:cover}
.preview span{font-size:12px;color:#94A3B8}
.status-msg{padding:12px 14px;border-radius:10px;margin-bottom:14px;display:none;font-size:13px}
.status-msg.success{display:block;background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.3);color:#7FFFD2}
.status-msg.error{display:block;background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.3);color:#FF8C9A}
.history-card{background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;margin-bottom:10px}
.history-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.history-email{font-size:13px;color:#D8E1FF;font-weight:700}
.history-date{font-size:12px;color:#94A3B8;white-space:nowrap}
.history-text{font-size:14px;color:#E2E8F0;margin:8px 0;line-height:1.5;white-space:pre-wrap}
.reply-block{background:rgba(0,229,160,.08);border-left:3px solid #00E5A0;padding:10px 14px;margin-top:10px;border-radius:8px}
.reply-from{font-size:11px;color:#00E5A0;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.reply-msg{font-size:13px;color:#E8F0FE;margin-top:4px;line-height:1.5;white-space:pre-wrap}
.reply-time{font-size:11px;color:#94A3B8;margin-top:4px}
.reply-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,229,160,.15);color:#7FFFD2;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-top:8px}
@media(max-width:720px){.topbar{padding:14px 18px}.container{padding:0 16px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-icon">🗨️</div>
    <div>
      <div class="brand-title">Fikr-mulohaza</div>
      <div class="brand-sub">Biz bilan bog'laning</div>
    </div>
  </div>
  <div class="topbar-actions">
    <a class="btn" href="javascript:window.close()">← Orqaga</a>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>Fikr-mulohaza yuboring</h1>
    <p>Har bir xabar adminlar tomonidan ko'rib chiqiladi va sizga javob qaytariladi</p>
  </div>

  <div class="card">
    <div id="status" class="status-msg"></div>
    <div class="form-row">
      <label class="form-label">Xabaringiz</label>
      <textarea class="form-textarea" id="description" placeholder="Muammo yoki taklifingizni yozing..." maxlength="2000"></textarea>
    </div>
    <div class="form-row">
      <label class="form-label">Email (ixtiyoriy — javob olish uchun)</label>
      <input type="email" class="form-input" id="email" placeholder="email@example.com" />
    </div>
    <div class="form-row">
      <label class="form-label">Rasm biriktirish (ixtiyoriy)</label>
      <div class="upload-row">
        <button type="button" class="upload-btn" onclick="document.getElementById('image-input').click()">📎 Rasm tanlash</button>
        <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleUpload(event)" />
        <span style="color:#94A3B8;font-size:12px" id="file-name"></span>
      </div>
      <div class="preview" id="preview" style="display:none">
        <img id="preview-img" alt="Preview" />
        <span id="preview-name">Rasm tanlandi</span>
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;padding:14px;font-size:14px;justify-content:center" onclick="submitFeedback()">✅ Yuborish</button>
  </div>

  <h2 style="font-size:18px;font-weight:800;margin:24px 0 14px">📬 Sizning xabarlaringiz</h2>
  <div id="history"></div>
</div>

<script>
let imageBase64 = null;

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-msg ' + (type || '');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function handleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showStatus('❌ Fayl 5MB dan katta', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    imageBase64 = e.target.result;
    document.getElementById('preview').style.display = 'flex';
    document.getElementById('preview-img').src = imageBase64;
    document.getElementById('preview-name').textContent = file.name;
    document.getElementById('file-name').textContent = file.name;
  };
  reader.readAsDataURL(file);
}

async function submitFeedback() {
  const description = document.getElementById('description').value.trim();
  const email = document.getElementById('email').value.trim();
  if (!description) {
    showStatus('❌ Iltimos, fikr-mulohazangizni kiriting', 'error');
    return;
  }
  const btn = document.querySelector('button.btn-primary');
  btn.disabled = true; btn.textContent = '⏳ Yuborilmoqda...';
  try {
    // Avval backend (13337) ga, keyin mirror uchun local ham yuboriladi.
    const payload = {
      text: description,
      email: email || null,
      image: imageBase64 || null,
      timestamp: new Date().toISOString(),
    };
    let sentOk = false;
    try {
      const r = await fetch('http://localhost:13337/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (r.ok) sentOk = true;
    } catch (e) {}
    // Bridge orqali yuborish (backup)
    try {
      if (window._ipc && window._ipc.invoke) {
        await window._ipc.invoke('feedback-send', payload);
        sentOk = true;
      }
    } catch (e) {}
    // Ma'lumotni lokal tarixga ham saqlaymiz — admin javobi kelganini ko'rish uchun
    saveLocalFeedback(payload);
    if (sentOk) {
      showStatus('✅ Xabaringiz yuborildi! Tez orada javob olasiz.', 'success');
      document.getElementById('description').value = '';
      document.getElementById('email').value = '';
      document.getElementById('image-input').value = '';
      imageBase64 = null;
      document.getElementById('preview').style.display = 'none';
      document.getElementById('file-name').textContent = '';
      loadHistory();
    } else {
      showStatus('⚠️ Tarmoq xatosi — keyinroq urinib ko\'ring.', 'error');
    }
  } catch (e) {
    showStatus('❌ Xatolik: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '✅ Yuborish';
  }
}

const HISTORY_KEY = 'nm_feedback_history_v1';
const REPLY_KEY = 'nm_feedback_replies_v1';
function loadLocalFeedback() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { return []; }
}
function saveLocalFeedback(item) {
  const list = loadLocalFeedback();
  item.id = item.id || ('fb_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,5));
  item.submittedAt = item.timestamp || new Date().toISOString();
  list.unshift(item);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 50)));
}
function loadLocalReplies() {
  try { return JSON.parse(localStorage.getItem(REPLY_KEY) || '{}'); } catch (e) { return {}; }
}
function saveLocalReply(feedbackId, reply) {
  const r = loadLocalReplies();
  if (!r[feedbackId]) r[feedbackId] = [];
  r[feedbackId].push(reply);
  localStorage.setItem(REPLY_KEY, JSON.stringify(r));
}

async function loadHistory() {
  const items = loadLocalFeedback();
  const replies = loadLocalReplies();
  const c = document.getElementById('history');
  if (!items.length) {
    c.innerHTML = '<div style="text-align:center;color:#94A3B8;padding:30px;background:rgba(15,23,42,.4);border-radius:16px">Sizda hozircha xabarlar yo\'q. Yuqorida yangi xabar yozing.</div>';
    return;
  }
  c.innerHTML = items.map(it => {
    const fbReplies = replies[it.id] || [];
    const repliedFlag = fbReplies.length ? '<div class="reply-badge">✓ Admin javob berdi</div>' : '';
    const repliesHtml = fbReplies.map(r => `
      <div class="reply-block">
        <div class="reply-from">${r.from || 'admin'}</div>
        <div class="reply-msg">${escapeHTML(r.message)}</div>
        <div class="reply-time">${new Date(r.createdAt).toLocaleString()}</div>
      </div>
    `).join('');
    return `
      <div class="history-card">
        <div class="history-row">
          <div class="history-email">${escapeHTML(it.email || 'anonymous@niex.local')}</div>
          <div class="history-date">${new Date(it.submittedAt).toLocaleString()}</div>
        </div>
        <div class="history-text">${escapeHTML(it.text)}</div>
        ${repliedFlag}
        ${repliesHtml}
      </div>
    `;
  }).join('');
}

function escapeHTML(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Admin javobi kelganda — ko'rsatish uchun listener
async function pollForReplies() {
  try {
    const r = await fetch('http://localhost:13337/api/feedback-replies');
    if (r.ok) {
      const data = await r.json();
      if (data && data.replies && Array.isArray(data.replies)) {
        for (const reply of data.replies) {
          saveLocalReply(reply.feedbackId, reply);
        }
        loadHistory();
      }
    }
  } catch (e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  loadHistory();
  // Har 20 soniyada reply bor-yo'qligini tekshirish
  pollForReplies();
  setInterval(pollForReplies, 20000);
});
</script>
</body>
</html>
